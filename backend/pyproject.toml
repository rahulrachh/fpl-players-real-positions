[project]
name = "fpl-real-shape-backend"
version = "0.1.0"
description = "Backend for the FPL Real Shape Visualizer"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]
sync = [
    "curl-cffi>=0.16.3",
]

[tool.uv]
package = false
default-groups = ["dev", "sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
